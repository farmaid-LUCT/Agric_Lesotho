name: farm_aid_app
description: "AI-powered Crop Disease Detection for Lesotho Farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+5               
  url_launcher: ^6.2.4
  google_generative_ai: ^0.4.0 

  # --- DATA & STORAGE ---
  shared_preferences: ^2.2.2      
  http: ^1.1.0                    
  supabase_flutter: ^2.0.0
  path_provider: ^2.1.2       
  
  # --- AI & IMAGE PROCESSING ---
  # Mobile Engine
  tflite_flutter: ^0.12.1        
  # Web/Laptop Engine (Uses WebAssembly to run .tflite in browser)
  tflite_web: ^0.1.2  # Use this specific version  
  
  opencv_dart: ^1.1.0            
  image_picker: ^1.0.4           
  image: ^4.1.3                  
  geolocator: ^13.0.1
  intl: ^0.20.2
  video_player: ^2.8.1
  fl_chart: ^0.70.0

  # --- MULTILINGUAL SUPPORT & TOOLS ---
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.1.0

  google_mlkit_translation: ^0.12.0  
  translator: 1.0.4+1
  showcaseview: ^3.0.0

  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# --- APP ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2E7D32" 
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true 
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # --- FOLDER REGISTRATION ---
  assets:
    - assets/images/             
    - assets/models/farm_aid_model.tflite
    - assets/models/labels.txt
    - assets/lang/
    - assets/models/             # Important: Register folder for tflite_web access




