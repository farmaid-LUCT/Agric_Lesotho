<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1faf5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; border-top: 5px solid #00A844; }
        h1 { color: #1B5E20; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
        .icon { font-size: 50px; color: #00A844; margin-bottom: 20px; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background-color: #00A844; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✔️</div>
        <h1>Dumela!</h1>
        <p>Your <strong>FarmAid Lesotho</strong> account has been successfully activated.</p>
        <p>You can now return to the app and sign in to start scanning your crops.</p>
        <a href="#" class="btn">Return to App</a>
    </div>
</body>
</html>
